name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # No `with:` block: every default already matches a decision this repo makes.
  #   * coverage — the hand-written job walked lcov and failed on any `DA:n,0`
  #     not annotated `// cov:unreachable`. That is exactly `coverage-gate:
  #     strict`, the default. All 8 existing markers already carry a `: reason`,
  #     satisfying `require-exemption-reason: true`.
  #     The old walker also skipped `/tests/` and `/fuzz/` paths; that guard is
  #     vestigial and is deliberately not carried across — `cargo llvm-cov
  #     --workspace --all-features --lcov` emits `SF:` records for `src/` files
  #     only, so the skip never had anything to match.
  #   * os-matrix — the old test job already ran the ubuntu/macos/windows matrix.
  #   * all-features — the old coverage and test jobs already passed
  #     `--all-features`.
  ci:
    uses: SecurityRonin/fleet-ci/.github/workflows/rust-ci.yml@f9802dca64a95eb881fd05dd3f4f16e53b97f2b3

  # Repo-specific unsafe reporting, not a gate (`continue-on-error: true`), and
  # the reusable workflow has no equivalent job. Copied verbatim from the
  # hand-written ci.yml so adoption neither drops nor alters it.
  geiger:
    name: Unsafe Audit (cargo-geiger)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
      - run: cargo install cargo-geiger --locked
      - run: cargo geiger 2>&1 || true
