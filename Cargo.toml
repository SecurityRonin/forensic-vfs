[workspace]
resolver = "2"
members = ["crates/core", "crates/resolver"]

# Single source of truth for fields shared by every member (DRY): bump version /
# MSRV / license here once; members inherit via `field.workspace = true`.
[workspace.package]
version = "0.7.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/SecurityRonin/forensic-vfs"

[workspace.dependencies]
thiserror = "2"
tempfile = "3"
serde = { version = "1", features = ["derive"] }
# The canonical filesystem-identity newtypes (`FsKind`, and now `FileId` per ADR
# 0009) live here. Zero-dep, so a non-optional dep keeps the leaf/lean rule (design
# handoff): forensic-vfs re-exports both as its own. FileId landed in
# forensicnomicon-core 1.4.0, so this pins the published registry version.
forensicnomicon-core = "1.4"
# `findings` feature bridge — a non-default feature, so a reader that implements
# these traits does not inherit the full forensicnomicon facade (the true-leaf
# rule, design §4).
forensicnomicon = "1"
# KNOWLEDGE [H] state-history vocabulary — `EpochTag`, carried by `SnapshotView`.
# Zero-dep KNOWLEDGE-tier leaf, so a non-optional dep keeps the leaf/lean rule.
state-history-forensic = "0.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all                      = { level = "warn", priority = -1 }
pedantic                 = { level = "warn", priority = -1 }
correctness              = { level = "deny", priority = -1 }
suspicious               = { level = "deny", priority = -1 }
unwrap_used              = "deny"
expect_used              = "deny"
# priority 1 so these individual allows outrank the grouped warn/deny entries above.
module_name_repetitions  = { level = "allow", priority = 1 }
must_use_candidate       = { level = "allow", priority = 1 }
missing_errors_doc       = { level = "allow", priority = 1 }
missing_panics_doc       = { level = "allow", priority = 1 }
doc_markdown             = { level = "allow", priority = 1 }
cast_possible_truncation = { level = "allow", priority = 1 }
cast_possible_wrap       = { level = "allow", priority = 1 }
cast_sign_loss           = { level = "allow", priority = 1 }
